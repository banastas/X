<!doctype html>
<html lang="en" data-x-desktop-fixture="true">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>X desktop test fixture</title>
<style>
:root { color-scheme: light dark; font: 16px system-ui; }
body { margin: 0; } main { max-width: 600px; margin: auto; }
[role=tablist] { display:flex; position:sticky; top:0; background:Canvas; border-bottom:1px solid GrayText; }
[role=tab] { flex:1; padding:20px 10px; border:0; color:GrayText; background:transparent; font:700 20px system-ui; }
[aria-selected=true] { color:CanvasText; box-shadow:inset 0 -4px #1d9bf0; }
article { padding:24px; border-bottom:1px solid GrayText; min-height:110px; }
textarea { width:80%; margin:20px; } #nested { height:120px; overflow-y:auto; margin:20px; border:1px solid GrayText; }
</style>
<main data-testid="primaryColumn">
<div role="tablist"><button role="tab" aria-selected="true">For you</button><button role="tab" aria-selected="false">Following</button></div>
<div id="composer"></div><div id="feed"></div>
</main>
<script>
const tabs = [...document.querySelectorAll('[role=tab]')];
function choose(index) {
  tabs.forEach((tab, i) => tab.setAttribute('aria-selected', String(i === index)));
  document.querySelector('#feed').replaceChildren(...Array.from({length:15}, (_, i) => {
    const article = document.createElement('article');
    const name = document.createElement('strong'); name.textContent = 'Test account ' + (i + 1);
    const p = document.createElement('p'); p.textContent = (index ? 'Following' : 'For you') + ' fixture post. Local content for testing scrolling and refresh behavior.';
    article.append(name,p); return article;
  }));
}
tabs.forEach((tab, index) => tab.addEventListener('click', () => choose(index))); choose(0);
window.addEventListener('popstate', () => { document.documentElement.dataset.xDesktopFixture = location.hash === '#detail' ? 'false' : 'true'; });
window.fixture = {
  draft(text='Unsent draft') { const field = document.createElement('textarea'); field.value=text; document.querySelector('#composer').append(field); field.focus(); },
  blur() { document.activeElement.blur(); },
  clearDraft() { document.querySelector('#composer').replaceChildren(); },
  dialog() { const el=document.createElement('div'); el.role='dialog'; el.textContent='Test dialog'; document.body.append(el); },
  nested() { const el=document.createElement('div'); el.id='nested'; el.innerHTML='<div style="height:500px">Nested scroll content</div>'; document.querySelector('main').prepend(el); el.scrollTop=50; }
};
</script>
</html>
