<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X for macOS — not found</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<!-- Cloudflare Pages serves this, with a 404, for any path the site doesn't have. Without it, a missing path gets
     index.html with a 200: appcast.xml before the first release would be a page Sparkle can't read (Rune's lesson).
     Absolute paths: it can be served from any depth. -->
<link rel="icon" href="/icon-64.png" type="image/png" sizes="64x64">
<style>
:root { --bg: #0a0a0a; --border: #2b2b2b; --bright: #f0f0f0; --dim: #7d7d7d; --text: #c4c4c4; --gutter: 16px; }
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: dark; }
body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
a { color: var(--bright); text-decoration: none; border-bottom: 1px solid var(--border); }
.wrap { max-width: 860px; width: 100%; margin: 0 auto; padding: 0 var(--gutter); }
header { border-bottom: 1px solid var(--border); }
header .wrap { display: flex; align-items: center; height: 48px; }
header a { display: flex; align-items: center; gap: 9px; border: 0; font-weight: 650; }
header img { width: 26px; height: 26px; margin: 0 -2px; }
main { flex: 1; display: flex; align-items: center; }
h1 { margin: 0 0 12px; color: var(--bright); font-size: clamp(48px, 12vw, 96px); line-height: 1; }
footer { border-top: 1px solid var(--border); padding: 24px 0 48px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
</style>
</head>
<body>
<header><div class="wrap"><a href="/"><img src="/icon-64.png" alt="" width="26" height="26">X for macOS</a></div></header>
<main>
  <div class="wrap">
    <h1>404</h1>
    <p>Nothing is at this address. The page may have moved, or the link has a typo.</p>
    <p><a href="/">Back to X for macOS</a></p>
  </div>
</main>
<footer><div class="wrap">X for macOS · © 2026 banast.as</div></footer>
</body>
</html>
